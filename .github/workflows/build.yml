name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -qo gym_track.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Add Android files
        run: |
          flutter create --platforms=android --project-name gym_tracker --org com.gymtracker /tmp/scaffold
          cp -r /tmp/scaffold/android gym_tracker/android
          bash gym_tracker/tool/prepare.sh

      - name: Build APK
        working-directory: gym_tracker
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: gym-tracker-apk
          path: gym_tracker/build/app/outputs/flutter-apk/app-release.apk
